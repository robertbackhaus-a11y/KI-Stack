name: Validate universal package gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation-gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run native Validation Gate self-test
        shell: pwsh
        run: ./tools/package-validation-gate/current/Test-KIStack-Universal-ValidationGate.ps1
